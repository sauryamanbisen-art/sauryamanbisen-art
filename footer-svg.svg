<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1520 270" width="100%" role="img" aria-label="Premium charcoal and champagne-gold geometric footer">
  <defs>
    <linearGradient id="footerSurface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#17191C"/>
      <stop offset="52%" stop-color="#101214"/>
      <stop offset="100%" stop-color="#0B0D0F"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#806744" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#D4B780" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#806744" stop-opacity="0.35"/>
    </linearGradient>
    <pattern id="microGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#C8A96E" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Original dimensions and silhouette preserved -->
  <polygon points="0,0 750,50 1500,0 1500,250 0,250" fill="url(#footerSurface)" stroke="#101214" stroke-width="20" stroke-linejoin="round"/>
  <polygon points="0,0 750,50 1500,0 1500,250 0,250" fill="url(#microGrid)"/>

  <!-- Restrained champagne-gold accent following the dipped edge -->
  <path d="M18 7 L750 55 L1482 7" fill="none" stroke="url(#goldLine)" stroke-width="1.5"/>
  <path d="M40 226 H310 M1190 226 H1460" fill="none" stroke="#C8A96E" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Minimal geometric ornaments; original placement language retained -->
  <g fill="none" stroke="#C8A96E" stroke-opacity="0.42" stroke-width="1.5">
    <rect x="300" y="100" width="50" height="50" transform="rotate(25 325 125)"/>
    <rect x="1150" y="80" width="70" height="70" transform="rotate(-15 1185 115)" stroke-opacity="0.62"/>
    <rect x="700" y="150" width="40" height="40" transform="rotate(40 720 170)" stroke-opacity="0.32"/>
    <rect x="150" y="180" width="60" height="60" transform="rotate(-10 180 210)" stroke-opacity="0.30"/>
  </g>
  <g fill="#D4B780">
    <circle cx="390" cy="82" r="2" opacity="0.7"/>
    <circle cx="1080" cy="176" r="2" opacity="0.55"/>
    <circle cx="820" cy="214" r="1.6" opacity="0.45"/>
  </g>
</svg>
